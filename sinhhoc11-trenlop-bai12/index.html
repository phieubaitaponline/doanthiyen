      const b=build(); if(th) b.answered=dl.filter(x=>x===2).length;
      const khoa=JSON.stringify([b.answers,b.answered,dl,S.map(x=>x?x.att||0:0)]);
      if(khoa===roiKhoa) return; roiKhoa=khoa;                                       /* không có gì mới: không gửi lại */
      const body=JSON.stringify(b); let ok=false;
      try{ ok=!!(navigator.sendBeacon&&navigator.sendBeacon(REPORT_URL,new Blob([body],{type:'text/plain;charset=utf-8'}))); }catch(e){}
      if(!ok) fetch(REPORT_URL,{method:'POST',mode:'no-cors',body,keepalive:body.length<60000}).catch(()=>{});
    }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') roiTrang(); });
  addEventListener('pagehide',roiTrang);
  /* lưu tiến độ trên máy để tải lại trang thì làm tiếp, không làm lại từ đầu */
  function save(){ if(!attemptId) return; store({attemptId, picks:PICKS, S, cur, t0, done:finished, usedSec}); }
  function progress(){ save(); send(); }
  /* ---------- tạo file .xlsx ngay trong trình duyệt (không cần thư viện) ---------- */
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  function zip(files){ const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
    const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
    files.forEach(f=>{ const name=enc.encode(f.name), data=enc.encode(f.data), c=crc32(data);
      const common=[...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)];
      const loc=new Uint8Array([...u32(0x04034b50),...common]); parts.push(loc,name,data);
      cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...common,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
      off+=loc.length+name.length+data.length; });
    const cenSize=cen.reduce((a,b)=>a+b.length,0);
    const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cenSize),...u32(off),...u16(0)]);
    return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); }
  const x=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const col=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
  function sheetXML(rows,widths){ // rows: [[{v,s}]] ; s: 1=đậm tiêu đề, 2=đậm, 3=xuống dòng
    const cols=widths?'<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>':'';
    const data=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((c,ci)=>{ if(c==null)return ''; const o=typeof c==='object'?c:{v:c};
      const ref=col(ci)+(ri+1), st=o.s?` s="${o.s}"`:'';
      return typeof o.v==='number'?`<c r="${ref}"${st}><v>${o.v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${x(o.v)}</t></is></c>`;}).join('')+'</row>').join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${data}</sheetData></worksheet>`; }
  function xlsx(sheets){ const ns='http://schemas.openxmlformats.org/';
    const files=[
      {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${ns}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
      {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships"><Relationship Id="rId1" Type="${ns}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
      {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${ns}spreadsheetml/2006/main" xmlns:r="${ns}officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
      {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${ns}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${ns}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
      {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${ns}spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8E3FF"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="4"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/><xf fontId="1" applyFont="1"/><xf applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs></styleSheet>`},
      ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXML(s.rows,s.widths)}))];
    return zip(files); }
  function download(){
    const r=rec||build(), H=v=>({v,s:1}), B=v=>({v,s:2}), W=v=>({v,s:3});
    const tong=[[B('BÁO CÁO KẾT QUẢ BÀI TẬP')],[],
      ['Bài',r.lesson],['Họ và tên',r.name],['Lớp',r.cls],['Bắt đầu',r.start],['Nộp bài',r.submitted],['Thời gian làm',r.duration],[],
      ['Điểm (thang 10)',r.score10],['Số câu đúng',`${r.correct}/${r.total}`],['Đúng ngay lần 1',`${r.firstTry}/${r.total}`],
      ...Object.keys(r.parts).filter(k=>r.parts[k]).map(k=>[k,r.parts[k]])];
    const ct=[[H('Câu'),H('Mức độ'),H('Dạng bài'),H('Kết quả'),H('Điểm'),H('Đáp án đúng')],

    const blob=xlsx([{name:'Tổng quan',rows:tong,widths:[20,48]},{name:'Chi tiết từng câu',rows:ct,widths:[6,12,26,16,7,60]}]);
    const safe=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
    const fname=`KetQua_${safe(r.lessonId)}_${safe(r.cls)||'Lop'}_${safe(r.name)||'HocSinh'}.xlsx`;
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); return fname; }
  /* ---------- giao diện ---------- */
  function introForm(){ const st=student();

    if(old&&old.attemptId){ attemptId=old.attemptId; finished=false; go(old); return; }
    attemptId=Date.now().toString(36)+Math.random().toString(36).slice(2,8); finished=false; go(null); progress(); }
  function onResult(){ finished=true; rec=build();
    const acts=app.querySelectorAll('.actions'), act=acts[acts.length-1];
    if(act){ const b=document.createElement('button'); b.className='btn btn-xls'; b.id='xlsBtn'; b.textContent='Tải kết quả (Excel)'; b.onclick=download; act.insertBefore(b,act.firstChild);
    }

    if(!student().name) localSet('rp_name',nm); const el=document.getElementById('rpName'); if(el&&!el.value) el.value=nm; }

/* ================= v4.2: GIỮ KHUNG HÌNH Ở NỘI DUNG BÀI ================= */
function _khung(){ const sb=document.querySelector('.statusbar'), hd=document.querySelector('header.topbar'), card=app.querySelector('.qcard');
  return {sb, sbH:(sb?sb.offsetHeight:0), hdH:(hd?hd.offsetHeight:0), card}; }
function _dichKhung(){ const k=_khung(); let top=k.hdH;                    // thanh tiến trình nằm ngay dưới tên bài
  if(window.matchMedia('(max-width:760px)').matches && k.card) top=k.card.getBoundingClientRect().top+window.scrollY-k.sbH-8;
  return Math.max(0,Math.round(top)); }
function ganKhung(smooth){ if(phase!=='quiz') return;
  const t=_dichKhung(); window.scrollTo({top:t, behavior:smooth?'smooth':'auto'});
  setTimeout(()=>{ if(phase!=='quiz') return; const t2=_dichKhung(); if(Math.abs(t2-t)>4) window.scrollTo({top:t2, behavior:'auto'}); }, 420); }
/* số có nhiều chữ số (2 000 000) không bị ngắt xuống dòng giữa các nhóm: đổi dấu cách thành dấu cách không ngắt khi hiển thị */
function giuSo(root){ const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ const t=n.nodeValue; if(/\d \d{3}/.test(t)) n.nodeValue=t.replace(/(\d) (?=\d{3}(?!\d))/g,'$1\u00A0'); } }
new MutationObserver(()=>giuSo(app)).observe(app,{childList:true, subtree:true});
function hienPhanHoi(){ if(phase!=='quiz') return;
  setTimeout(()=>{ const k=_khung(); if(!k.card) return; const r=k.card.getBoundingClientRect();
    const want=r.bottom-window.innerHeight+16; if(want<=0) return;
    const fb=k.card.querySelector('.fb'); const lim=(fb?fb.getBoundingClientRect().top:r.top)-k.sbH-10;
    const d=Math.min(want, lim); if(d>0) window.scrollBy({top:d, behavior:'smooth'}); }, 60); }
renderIntro();

<script>
/* ================= DẠNG CÂU MỚI HOÁ HỌC 12: bấm vùng trên hình (pick-region) =================
   Dữ liệu: q.img (tệp ảnh), q.vb [rộng, cao] (toạ độ ảnh), q.regions [{k, d (đường SVG), label}], q.answer [k...] (đã sắp xếp), q.multi.
   Chỉ THÊM vào engine TO5 bằng cách bọc hàm, không sửa hàm gốc. */
(function(){
const T7=['pick-region'];
TYPE_LABEL['pick-region']='Bấm vùng trên hình';
const lab=(q,k)=>{const r=q.regions.find(x=>x.k===k); return r?r.label:k;};
const _initV=initV; initV=function(q){ return q.type==='pick-region'?[]:_initV(q); };
const _cell=cellResults; cellResults=function(q,v){
  if(q.type==='pick-region') return [v.length===q.answer.length&&q.answer.every(a=>v.includes(a))];
  return _cell(q,v); };
const _isC=isCorrect; isCorrect=function(q,v){ return T7.includes(q.type)?cellResults(q,v).every(Boolean):_isC(q,v); };
const _miss=missing; missing=function(q,v){
  if(q.type==='pick-region') return v.length?'':'Em hãy bấm vào hình để chọn nhé.';
  return _miss(q,v); };
const _ans=answerText; answerText=function(q){
  if(q.type==='pick-region') return q.answer.map(k=>lab(q,k)).join(', ');
  return _ans(q); };
const _mw=markWrong; markWrong=function(q,s){ if(!T7.includes(q.type))return _mw(q,s);
  s.marks={w:1}; s.v.filter(k=>!q.answer.includes(k)).forEach(k=>s.marks['x'+k]=1); s.v=s.v.filter(k=>q.answer.includes(k)); };

const _body=body; body=function(i){ const q=QUIZ_DATA[i]; if(!T7.includes(q.type)) return _body(i);
  const s=S[i], v=s.v, lk=locked(i), fin=s.status==='fail', okAll=s.status==='ok1'||s.status==='ok2';
  const W=q.vb[0], H=q.vb[1];
  let h=`<div class="pr-wrap${lk?' locked':''}${s.marks.w?' wrong':''}" style="aspect-ratio:${W}/${H};max-width:${Math.min(720,Math.round(430*W/H))}px">`;
  h+=`<img src="${q.img}" alt="${escA(ALT[q.img]||'Hình vẽ')}">`;
  h+=`<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Các vùng bấm trên hình">`;
  q.regions.forEach(r=>{ const on=v.includes(r.k); let c='';
    if(okAll) c=on?'ok':''; else if(fin) c=q.answer.includes(r.k)?'ok':(on?'bad':''); else c=on?'sel':(s.marks['x'+r.k]?'bad':'');
    h+=`<path class="pr ${c}" d="${r.d}" ${lk?'':'data-act="pr"'} data-k="${r.k}" tabindex="${lk?-1:0}" role="button" aria-pressed="${on}" aria-label="${escA(r.label)}"><title>${escRaw(r.label)}</title></path>`; });
  h+=`</svg></div>`;
  h+=`<p class="pr-chon">${v.length?'Em đã chọn: '+v.map(k=>esc(lab(q,k))).join(', '):'Em chưa chọn vùng nào.'}</p>`;
  if(!lk) h+=`<p class="note">${q.multi?'Bấm vào các vùng trên hình để chọn (bấm lại để bỏ chọn).':'Bấm vào một vùng trên hình để chọn (bấm vùng khác để đổi).'}</p>`;
  return h; };

app.addEventListener('click',e=>{
  if(phase!=='quiz'||view!==cur||locked(cur))return; const a=e.target.closest('[data-act="pr"]'); if(!a)return;
  const q=QUIZ_DATA[cur], s=S[cur]; if(q.type!=='pick-region')return; change();
  const k=a.dataset.k, j=s.v.indexOf(k);
  if(q.multi){ j<0?s.v.push(k):s.v.splice(j,1); } else { s.v=(j<0)?[k]:[]; }
  delete s.marks.w; delete s.marks['x'+k]; renderQuestion(); });
app.addEventListener('keydown',e=>{ const a=e.target.closest&&e.target.closest('[data-act="pr"]'); if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); a.dispatchEvent(new MouseEvent('click',{bubbles:true}));} });
})();
</script>
</body></html>
